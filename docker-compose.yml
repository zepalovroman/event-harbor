services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: payment-processor:local
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key':'$${PAYMENTS_API_KEY:-change-me}'}))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox:
    image: payment-processor:local
    command: python -m app.workers.outbox
    environment:
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-change-me}
    depends_on:
      api:
        condition: service_healthy

  consumer:
    image: payment-processor:local
    command: python -m app.workers.consumer
    environment:
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-change-me}
    depends_on:
      api:
        condition: service_healthy

  webhook-receiver:
    image: mendhak/http-https-echo:35
    profiles: ["test"]
    environment:
      HTTP_PORT: 8080
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  rabbitmq_data:
